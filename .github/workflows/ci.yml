name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff build

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: |
          pytest -q \
            tests/test_array_dir.py \
            tests/test_demix_determinism.py \
            tests/test_edge_cases.py \
            tests/test_external_stems.py \
            tests/test_json_formatting.py \
            tests/test_mlx_env.py \
            tests/test_mlx_inference.py \
            tests/test_spectrogram_backends.py \
            tests/test_runtime_shim.py \
            tests/test_weight_loading.py

      - name: Build package
        run: python -m build

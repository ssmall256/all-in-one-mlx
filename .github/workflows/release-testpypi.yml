name: Release to TestPyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example: 1.0.7)"
        required: true
        type: string

env:
  PACKAGE_VERSION: ${{ inputs.version }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/all-in-one-mlx
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set version from workflow input
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["PACKAGE_VERSION"]
          path = Path("src/allin1_mlx/__about__.py")
          source = path.read_text()
          patched, count = re.subn(
              r'^__version__ = ".*"$',
              f'__version__ = "{version}"',
              source,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit(f"Could not find __version__ in {path}")
          path.write_text(patched)
          print(f"Building all-in-one-mlx {version}")
          PY

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*

      - name: Validate built version
        run: |
          python - <<'PY'
          import os
          from email.parser import Parser
          from pathlib import Path
          from zipfile import ZipFile

          expected = os.environ["PACKAGE_VERSION"]
          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one wheel, got {wheels}")
          with ZipFile(wheels[0]) as archive:
              name = next(
                  n for n in archive.namelist() if n.endswith(".dist-info/METADATA")
              )
              metadata = Parser().parsestr(archive.read(name).decode())
          actual = metadata["Version"]
          if actual != expected:
              raise SystemExit(f"Requested {expected}, but built {actual}")
          print(f"Validated all-in-one-mlx {actual}")
          PY

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-testpypi:
    name: Smoke install from TestPyPI
    runs-on: macos-14
    needs: [publish]
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Wait for all-in-one-mlx on TestPyPI
        run: |
          python -m pip install --upgrade pip
          dist_dir="${RUNNER_TEMP}/all-in-one-mlx-dist"
          mkdir -p "${dist_dir}"
          # Up to 10 minutes: a freshly published file can take minutes to
          # reach every CDN mirror, and macOS runners hit stale ones often.
          for attempt in {1..60}; do
            if python -m pip download \
              --no-deps \
              --no-cache-dir \
              --only-binary :all: \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              --dest "${dist_dir}" \
              "all-in-one-mlx==${PACKAGE_VERSION}"; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "all-in-one-mlx ${PACKAGE_VERSION} did not reach TestPyPI within 10 minutes" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Install the downloaded distribution
        run: |
          shopt -s nullglob
          dists=("${RUNNER_TEMP}/all-in-one-mlx-dist"/all_in_one_mlx-*)
          if [ "${#dists[@]}" -ne 1 ]; then
            echo "Expected exactly one distribution, found ${#dists[@]}" >&2
            exit 1
          fi
          # Dependencies come from PyPI; mlx-audio-io is an sdist and compiles.
          # The wait only proves this package has propagated; a freshly
          # published dependency can still be missing from the mirror pip
          # resolves against. A resolution failure costs nothing, so retry.
          for attempt in {1..8}; do
            if python -m pip install --no-cache-dir "${dists[0]}"; then
              break
            fi
            if [ "${attempt}" -eq 8 ]; then
              echo "Could not install ${dists[0]}" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Smoke test
        run: |
          python -c "import allin1_mlx; print(f'all-in-one-mlx {allin1_mlx.__version__} import smoke passed')"

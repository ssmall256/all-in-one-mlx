name: Release to TestPyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example: 1.0.7)"
        required: true
        type: string
      allow_existing:
        description: "Proceed even if this version is already published (makes the upload a no-op)"
        required: false
        default: false
        type: boolean

env:
  PACKAGE_VERSION: ${{ inputs.version }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/all-in-one-mlx
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set version from workflow input
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["PACKAGE_VERSION"]
          path = Path("src/allin1_mlx/__about__.py")
          source = path.read_text()
          patched, count = re.subn(
              r'^__version__ = ".*"$',
              f'__version__ = "{version}"',
              source,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit(f"Could not find __version__ in {path}")
          path.write_text(patched)
          print(f"Building all-in-one-mlx {version}")
          PY

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*

      - name: Validate built version
        run: |
          python - <<'PY'
          import os
          from email.parser import Parser
          from pathlib import Path
          from zipfile import ZipFile

          expected = os.environ["PACKAGE_VERSION"]
          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one wheel, got {wheels}")
          with ZipFile(wheels[0]) as archive:
              name = next(
                  n for n in archive.namelist() if n.endswith(".dist-info/METADATA")
              )
              metadata = Parser().parsestr(archive.read(name).decode())
          actual = metadata["Version"]
          if actual != expected:
              raise SystemExit(f"Requested {expected}, but built {actual}")
          print(f"Validated all-in-one-mlx {actual}")
          PY

      - name: Refuse to silently re-release an existing version
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          ALLOW_EXISTING: ${{ inputs.allow_existing }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          name = "all-in-one-mlx"
          version = os.environ["PACKAGE_VERSION"]
          allow = os.environ.get("ALLOW_EXISTING", "").strip().lower() == "true"

          try:
              with urllib.request.urlopen(
                  f"https://test.pypi.org/pypi/{name}/{version}/json", timeout=30
              ) as response:
                  json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print(f"{name} {version} is not on TestPyPI yet; publishing.")
                  raise SystemExit(0)
              raise

          if not allow:
              raise SystemExit(
                  f"{name} {version} is already on TestPyPI. skip-existing would make "
                  "this publish a silent no-op, so a changed build would not ship while "
                  "the run still reported success. Bump the version, or re-dispatch with "
                  "allow_existing=true if a no-op re-run is what you want."
              )
          print(f"{name} {version} already on TestPyPI; allow_existing=true, upload is a no-op.")
          PY
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          repository-url: https://test.pypi.org/legacy/

  smoke-testpypi:
    name: Smoke install from TestPyPI
    runs-on: macos-14
    needs: [publish]
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Resolve the published all-in-one-mlx artifact
        run: |
          # pip resolves against the PEP 691 JSON rendering of
          # /simple/<project>/. That rendering is cached separately from the
          # PEP 503 HTML one and the two can serve different snapshots of the
          # same URL, so a freshly published version may be invisible to pip
          # while every other view of TestPyPI already shows it. Ask the release
          # API for the file directly, which sits outside that split, and
          # install the artifact by URL.
          python - <<'PY' >> "${GITHUB_ENV}"
          import json
          import os
          import time
          import urllib.request

          name = "all-in-one-mlx"
          version = os.environ["PACKAGE_VERSION"]
          api = f"https://test.pypi.org/pypi/{name}/{version}/json"

          for _ in range(60):
              try:
                  with urllib.request.urlopen(api, timeout=30) as response:
                      files = json.load(response)["urls"]
              except Exception:
                  files = []
              for kind in ("bdist_wheel", "sdist"):
                  for entry in files:
                      if entry["packagetype"] == kind:
                          print(f"ARTIFACT_URL={entry['url']}")
                          raise SystemExit(0)
              time.sleep(10)

          raise SystemExit(
              f"{name} {version} did not reach TestPyPI within 10 minutes"
          )
          PY

      - name: Install all-in-one-mlx from the resolved artifact
        run: |
          python -m pip install --upgrade pip
          # The artifact URL is exact, but dependencies still resolve through
          # the index, so retry: a freshly published dependency can be missing
          # from the mirror pip reads. A resolution failure costs nothing.
          for attempt in {1..8}; do
            if python -m pip install --no-cache-dir \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "${ARTIFACT_URL}"; then
              break
            fi
            if [ "${attempt}" -eq 8 ]; then
              echo "Could not install ${ARTIFACT_URL}" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Smoke test
        run: |
          python -c "import allin1_mlx; print(f'all-in-one-mlx {allin1_mlx.__version__} import smoke passed')"
